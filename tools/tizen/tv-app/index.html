<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=1920, height=1080" />
        <title>IPTVnator</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <aside id="rail"></aside>

        <header id="header">
            <div id="source-pill">
                <span class="pill-icon">≡</span>
                <span class="pill-text">
                    <span id="source-name">No source</span>
                    <span id="source-type"></span>
                </span>
            </div>
            <div id="breadcrumb"></div>
        </header>

        <main id="content">
            <section id="categories" class="pane side"></section>
            <section id="items" class="pane main"></section>
        </main>

        <footer id="hints">Arrows: move · OK: open · CH ▲▼: page · Return: back</footer>

        <div id="form" class="hidden">
            <h1 id="form-title">Add source</h1>
            <label for="form-name">Name (optional)</label>
            <input id="form-name" />
            <label for="form-url" id="form-url-label">Server URL</label>
            <input id="form-url" />
            <div id="form-login">
                <label for="form-user">Username</label>
                <input id="form-user" />
                <label for="form-pass">Password</label>
                <input id="form-pass" type="password" />
            </div>
            <div class="form-buttons">
                <button id="form-save">Save</button>
                <button id="form-cancel">Cancel</button>
            </div>
            <p id="form-msg"></p>
        </div>

        <div id="player" class="hidden">
            <video id="video"></video>
            <object id="avplayer" type="application/avplayer"></object>
            <div id="osd" class="hidden"></div>
        </div>

        <script src="$WEBAPIS/webapis/webapis.js"></script>
        <script src="vendor/hls.min.js"></script>
        <script src="vendor/mpegts.js"></script>
        <script src="js/log.js"></script>
        <script src="js/sources.js"></script>
        <script src="js/xtream.js"></script>
        <script src="js/m3u.js"></script>
        <script src="js/list.js"></script>
        <script src="js/player.js"></script>
        <script src="js/form.js"></script>
        <script src="js/browser.js"></script>
        <script src="js/app.js"></script>
    </body>
</html>
