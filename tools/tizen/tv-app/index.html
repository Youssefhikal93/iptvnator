<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=1920, height=1080" />
        <title>IPTVnator</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div id="login" class="screen hidden">
            <h1>IPTVnator</h1>
            <p class="hint">Sign in with your Xtream account</p>
            <label for="login-url">Server URL</label>
            <input id="login-url" placeholder="http://example.com:8080" />
            <label for="login-user">Username</label>
            <input id="login-user" />
            <label for="login-pass">Password</label>
            <input id="login-pass" type="password" />
            <button id="login-save">Sign in</button>
            <p id="login-msg" class="hint"></p>
        </div>

        <div id="browser" class="screen hidden">
            <nav id="tabs"></nav>
            <div id="panes">
                <section id="categories" class="pane"></section>
                <section id="items" class="pane"></section>
            </div>
            <footer class="hint">
                Arrows: move · OK: open · CH▲▼: page · Return: back
            </footer>
        </div>

        <div id="player" class="hidden">
            <video id="video"></video>
            <object id="avplayer" type="application/avplayer"></object>
            <div id="osd" class="hidden"></div>
        </div>

        <script src="$WEBAPIS/webapis/webapis.js"></script>
        <script src="vendor/hls.min.js"></script>
        <script src="vendor/mpegts.js"></script>
        <script src="js/log.js"></script>
        <script src="js/api.js"></script>
        <script src="js/list.js"></script>
        <script src="js/player.js"></script>
        <script src="js/app.js"></script>
    </body>
</html>
