<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=1920, height=1080" />

        <link rel="stylesheet" href="style.css" />
        <link rel="stylesheet" href="theme-accents.css" />
        <link rel="stylesheet" href="player.css" />
        <link rel="stylesheet" href="player-picture.css" />

    <body>
        <aside id="rail"></aside>

        <header id="header">
            <div id="searchbar">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14"/></svg>
                <input id="search-input" autocomplete="off" />
            </div>
            <div id="view-toggle">
                <span id="genre-button" class="view-btn hidden" data-mode="genre" title="Genre" data-i18n-title="find.genre"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 18h4v-2h-4zM3 6v2h18V6zm3 7h12v-2H6z"/></svg><span></span></span>
                <span class="view-btn" data-mode="list" title="List view" data-i18n-title="header.listView"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 13h2v-2H3zm0 4h2v-2H3zm0-8h2V7H3zm4 4h14v-2H7zm0 4h14v-2H7zM7 7v2h14V7z"/></svg></span>
                <span class="view-btn" data-mode="grid" title="Grid view" data-i18n-title="header.gridView"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11h5V5H4zm0 7h5v-6H4zm6 0h5v-6h-5zm6 0h5v-6h-5zm-6-7h5V5h-5zm6-6v6h5V5z"/></svg></span>
                <span class="view-btn hidden" data-mode="sort" title="Sort" data-i18n-title="browser.sort"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18v2H3zm0 5h12v2H3zm0 5h6v2H3z"/></svg></span>
                <span id="guide-button" class="view-btn hidden" data-mode="guide" data-i18n="header.guide">TV guide</span>
            </div>
        </header>

        <main id="content">
            <section id="categories" class="pane side"></section>
            <section id="items" class="pane main"></section>
            <section id="live-preview" aria-label="Live preview" data-i18n-label="settings.livePreview"></section>
            <section id="home"></section>
            <section id="settings"></section>
        </main>

        <div id="detail" class="hidden"></div>
        <section id="guide" class="hidden" aria-label="TV guide" data-i18n-label="header.guide"></section>
        <section id="manage" class="hidden" aria-label="Manage categories" data-i18n-label="manage.title"></section>
        <div id="menu" class="hidden"></div>
        <div id="toast" class="hidden"></div>
        <div id="load-error" class="hidden" role="alertdialog" aria-labelledby="load-message">
            <div id="load-message"></div>
            <p id="load-hint"></p>
            <div class="load-buttons">
                <button id="load-retry" class="state-button" data-i18n="common.retry">Retry</button>
                <button id="load-sources" class="state-button hidden" data-i18n="load.goToSources">Go to Sources</button>
            </div>
            <p id="load-countdown"></p>
        </div>

        <div id="status"></div>

        <div id="form" class="hidden">
            <h1 id="form-title" data-i18n="form.addSource">Add source</h1>
            <div class="form-columns">
                <div id="form-source">
                    <label for="form-name" data-i18n="form.nameOptional">Name (optional)</label>
                    <input id="form-name" />
                    <label for="form-url" id="form-url-label" data-i18n="form.serverUrl">Server URL</label>
                    <input id="form-url" />
                    <div id="form-login">
                        <label for="form-user" data-i18n="form.username">Username</label>
                        <input id="form-user" />
                        <label for="form-pass" data-i18n="form.password">Password</label>
                        <input id="form-pass" type="password" />
                    </div>
                </div>
                <div id="form-guide">
                    <label for="form-epg-url" data-i18n="form.guideLink">Guide link (XMLTV) (optional)</label>
                    <input id="form-epg-url" placeholder="https://example.com/guide.xml.gz" />
                    <label for="form-epg-offset" data-i18n="form.guideOffset">Guide time offset (hours, -12 to +12)</label>
                    <input id="form-epg-offset" type="number" min="-12" max="12" step="1" value="0" />
                    <div id="form-epg-preference">
                        <label for="form-epg-prefer" data-i18n="form.preferGuide">Prefer my guide</label>
                        <select id="form-epg-prefer"><option value="yes" data-i18n="common.on">On</option><option value="no" data-i18n="common.off">Off</option></select>
                    </div>
                </div>
            </div>
            <div class="form-buttons">
                <button id="form-save" data-i18n="common.save">Save</button>
                <button id="form-cancel" data-i18n="common.cancel">Cancel</button>
            </div>
            <p id="form-msg"></p>
        </div>

        <div id="player" class="hidden">
            <video id="video"></video>
            <object id="avplayer" type="application/avplayer"></object>
            <canvas id="pl-freeze" class="hidden" width="1920" height="1080"></canvas>
            <div id="pl-cover"></div>
            <div id="pl-subs"></div>
            <div id="pl-status" class="hidden">
                <div class="pl-spinner"></div>
                <div id="pl-status-text"></div>
                <div id="pl-error-actions" class="hidden">
                    <button class="state-button" data-i18n="player.retryPlayback">Retry playback</button>
                    <button class="state-button" data-i18n="common.back">Back</button>
                </div>
            </div>
            <div id="pl-controls" class="hidden">
                <div class="pl-top">
                    <div class="pl-titles">
                        <div id="pl-title"></div>
                        <div id="pl-subtitle"></div>
                    </div>
                    <span id="pl-speed" class="pl-chip hidden"></span>
                    <span id="pl-live" class="pl-badge hidden" data-i18n="player.live">LIVE</span>
                    <div class="pl-clock">
                        <span id="pl-now"></span>
                        <span id="pl-ends"></span>
                    </div>
                </div>
                <div class="pl-dock">
                    <div id="pl-epg" class="hidden"></div>
                    <div id="pl-seekbox">
                        <span id="pl-state"></span>
                        <span id="pl-cur">0:00</span>
                        <div id="pl-bar">
                            <div id="pl-fill"></div>
                            <div id="pl-target"></div>
                        </div>
                        <span id="pl-sep">/</span>
                        <span id="pl-total">0:00</span>
                    </div>
                    <div id="pl-transport">
                        <span id="pl-play" class="pl-circle pl-play"></span>
                        <div id="pl-buttons"></div>
                    </div>
                    <div id="pl-hint"></div>
                </div>
            </div>
            <div id="pl-skip" class="hidden"><span data-i18n="player.skipIntro">Skip intro</span> <b>▼</b></div>
            <div id="pl-next" class="hidden">
                <img id="pl-next-art" class="hidden" alt="" />
                <div class="pl-next-text">
                    <div class="pl-next-eyebrow" data-i18n="player.upNext">Up next</div>
                    <div id="pl-next-title"></div>
                    <div id="pl-next-count"></div>
                </div>
            </div>
            <div id="pl-episodes" class="hidden"></div>
            <div id="pl-menu" class="hidden"></div>
            <div id="pl-resume" class="hidden">
                <div id="pl-resume-title"></div>
                <div class="pl-resume-buttons">
                    <span id="pl-resume-yes"></span>
                    <span id="pl-resume-no" data-i18n="detail.startOver">Start over</span>
                </div>
            </div>
        </div>
