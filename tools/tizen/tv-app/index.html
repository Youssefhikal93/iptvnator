<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=1920, height=1080" />
        <title>IPTVnator</title>
        <link rel="stylesheet" href="style.css" />
        <link rel="stylesheet" href="player.css" />
    </head>
    <body>
        <aside id="rail"></aside>

        <header id="header">
            <div id="source-pill">
                <span class="pill-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10h11v2H3zm0-4h11v2H3zm0 8h7v2H3zm13-1v8l6-4z"/></svg></span>
                <span class="pill-text">
                    <span id="source-name">No source</span>
                    <span id="source-type"></span>
                </span>
                <svg class="pill-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.41 8.59 12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg>
            </div>
            <div id="searchbar">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14"/></svg>
                <input id="search-input" autocomplete="off" />
            </div>
            <div id="view-toggle">
                <span class="view-btn" data-mode="list" title="List view"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 13h2v-2H3zm0 4h2v-2H3zm0-8h2V7H3zm4 4h14v-2H7zm0 4h14v-2H7zM7 7v2h14V7z"/></svg></span>
                <span class="view-btn" data-mode="grid" title="Grid view"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11h5V5H4zm0 7h5v-6H4zm6 0h5v-6h-5zm6 0h5v-6h-5zm-6-7h5V5h-5zm6-6v6h5V5z"/></svg></span>
                <span class="view-btn hidden" data-mode="sort" title="Sort"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18v2H3zm0 5h12v2H3zm0 5h6v2H3z"/></svg></span>
                <span id="guide-button" class="view-btn hidden" data-mode="guide">TV guide</span>
            </div>
        </header>

        <main id="content">
            <section id="categories" class="pane side"></section>
            <section id="items" class="pane main"></section>
            <section id="home"></section>
            <section id="settings"></section>
        </main>

        <div id="detail" class="hidden"></div>
        <section id="guide" class="hidden" aria-label="TV guide"></section>
        <div id="menu" class="hidden"></div>
        <div id="toast" class="hidden"></div>
        <div id="load-error" class="hidden" role="alertdialog" aria-labelledby="load-message">
            <div id="load-message"></div>
            <p id="load-hint"></p>
            <button id="load-retry" class="state-button">Retry</button>
            <p id="load-countdown"></p>
        </div>

        <footer id="hints">Arrows: move · OK: open · CH ▲▼: page · Return: back</footer>

        <div id="form" class="hidden">
            <h1 id="form-title">Add source</h1>
            <div class="form-columns">
                <div id="form-source">
                    <label for="form-name">Name (optional)</label>
                    <input id="form-name" />
                    <label for="form-url" id="form-url-label">Server URL</label>
                    <input id="form-url" />
                    <div id="form-login">
                        <label for="form-user">Username</label>
                        <input id="form-user" />
                        <label for="form-pass">Password</label>
                        <input id="form-pass" type="password" />
                    </div>
                </div>
                <div id="form-guide">
                    <label for="form-epg-url">Guide link (XMLTV) (optional)</label>
                    <input id="form-epg-url" placeholder="https://example.com/guide.xml.gz" />
                    <label for="form-epg-offset">Guide time offset (hours, -12 to +12)</label>
                    <input id="form-epg-offset" type="number" min="-12" max="12" step="1" value="0" />
                    <div id="form-epg-preference">
                        <label for="form-epg-prefer">Prefer my guide</label>
                        <select id="form-epg-prefer"><option value="yes">On</option><option value="no">Off</option></select>
                    </div>
                </div>
            </div>
            <div class="form-buttons">
                <button id="form-save">Save</button>
                <button id="form-cancel">Cancel</button>
            </div>
            <p id="form-msg"></p>
        </div>

        <div id="player" class="hidden">
            <video id="video"></video>
            <object id="avplayer" type="application/avplayer"></object>
            <canvas id="pl-freeze" class="hidden" width="1920" height="1080"></canvas>
            <div id="pl-subs"></div>
            <div id="pl-status" class="hidden">
                <div class="pl-spinner"></div>
                <div id="pl-status-text"></div>
                <div id="pl-error-actions" class="hidden">
                    <button class="state-button">Retry playback</button>
                    <button class="state-button">Back</button>
                </div>
            </div>
            <div id="pl-controls" class="hidden">
                <div class="pl-top">
                    <div class="pl-titles">
                        <div id="pl-title"></div>
                        <div id="pl-subtitle"></div>
                    </div>
                    <span id="pl-speed" class="pl-chip hidden"></span>
                    <span id="pl-live" class="pl-badge hidden">LIVE</span>
                </div>
                <div class="pl-dock">
                    <div id="pl-epg" class="hidden"></div>
                    <div id="pl-seekbox">
                        <div id="pl-bar">
                            <div id="pl-fill"></div>
                            <div id="pl-target"></div>
                        </div>
                        <div class="pl-times">
                            <span id="pl-state"></span>
                            <span id="pl-cur">0:00</span>
                            <span id="pl-sep">/</span>
                            <span id="pl-total">0:00</span>
                            <span id="pl-jump"></span>
                        </div>
                    </div>
                    <div id="pl-buttons"></div>
                    <div id="pl-hint"></div>
                </div>
            </div>
            <div id="pl-skip" class="hidden">Skip intro <b>▼</b></div>
            <div id="pl-next" class="hidden">
                <div class="pl-next-eyebrow">Up next</div>
                <div id="pl-next-title"></div>
                <div id="pl-next-count"></div>
            </div>
            <div id="pl-episodes" class="hidden"></div>
            <div id="pl-menu" class="hidden"></div>
            <div id="pl-resume" class="hidden">
                <div id="pl-resume-title"></div>
                <div class="pl-resume-buttons">
                    <span id="pl-resume-yes"></span>
                    <span id="pl-resume-no">Start over</span>
                </div>
            </div>
        </div>

        <script src="$WEBAPIS/webapis/webapis.js"></script>
        <script src="vendor/hls.min.js"></script>
        <script src="vendor/mpegts.js"></script>
        <script src="js/log.js"></script>
        <script src="js/keys.js"></script>
        <script src="js/progress.js"></script>
        <script src="js/settings-store.js"></script>
        <script src="js/sources.js"></script>
        <script src="js/source-request.js"></script>
        <script src="js/retry.js"></script>
        <script src="js/load-screen.js"></script>
        <script src="js/xtream.js"></script>
        <script src="js/m3u-vod.js"></script>
        <script src="js/m3u.js"></script>
        <script src="js/sort.js"></script>
        <script src="js/library.js"></script>
        <script src="js/catalogue.js"></script>
        <script src="js/catalogue-loader.js"></script>
        <script src="js/epg.js"></script>
        <script src="js/xmltv-parser.js"></script>
        <script src="js/xmltv-store.js"></script>
        <script src="js/xmltv.js"></script>
        <script src="js/guide-data.js"></script>
        <script src="js/list.js"></script>
        <script src="js/player-series.js"></script>
        <script src="js/player-epg.js"></script>
        <script src="js/player-resume.js"></script>
        <script src="js/player-reconnect.js"></script>
        <script src="js/player-freeze.js"></script>
        <script src="js/player.js"></script>
        <script src="js/form.js"></script>
        <script src="js/menu.js"></script>
        <script src="js/source-guide.js"></script>
        <script src="js/watched.js"></script>
        <script src="js/detail.js"></script>
        <script src="js/detail-episodes.js"></script>
        <script src="js/home.js"></script>
        <script src="js/live-channels.js"></script>
        <script src="js/settings.js"></script>
        <script src="js/guide-time.js"></script>
        <script src="js/guide-view.js"></script>
        <script src="js/guide.js"></script>
        <script src="js/browser.js"></script>
        <script src="js/channel-list.js"></script>
        <script src="js/app.js"></script>
    </body>
</html>
