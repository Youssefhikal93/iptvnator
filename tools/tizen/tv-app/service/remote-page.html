<main>
    <header>
        <div class="brand">Jotv <b data-t="remote">remote</b></div>
        <div class="top"><div class="link" id="link"><span class="dot"></span><span id="linkText">Connected</span></div><button type="button" class="gear"><svg><use href="#gear"/></svg></button></div>
    </header>

    <section class="closed">
        <div class="tv"><svg><use href="#tvicon"/></svg></div>
        <h2 data-t="closedTitle">Jotv is closed</h2>
        <p data-t="closedText">Open Jotv on the TV with its remote. This page connects by itself.</p>
        <div class="codebox"><input id="code" maxlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false" /><button type="button" id="code-go" data-t="pairCode">Pair</button></div>
        <div class="spin"></div>
    </section>

    <section class="search">
        <label class="field"><svg><use href="#search"/></svg><input id="text" autocomplete="off" autocapitalize="off" spellcheck="false" /></label><button id="text-done" data-t="done"></button>
        <p class="hint" data-t="searchHint">Searching Series on the TV. Pick a result with the remote.</p>
    </section>

    <div class="card hide-search hide-closed" id="card">
        <div class="art" id="art">Jotv</div>
        <div class="np">
            <small id="kind"></small>
            <h2 id="title"></h2>
            <p id="sub"></p>
            <div class="bar"><i id="fill"></i></div>
            <div class="times"><span id="t1"></span><span id="t2"></span></div>
        </div>
    </div>

    <div class="context hide-search hide-closed" id="context"></div>

    <div class="pad hide-search hide-closed">
        <div class="dpad">
            <button type="button" class="arrow up"><svg><use href="#up"/></svg></button>
            <button type="button" class="arrow down"><svg><use href="#down"/></svg></button>
            <button type="button" class="arrow left"><svg><use href="#left"/></svg></button>
            <button type="button" class="arrow right"><svg><use href="#right"/></svg></button>
            <button type="button" class="ok" id="ok" data-t="ok">OK</button>
            <button type="button" class="corner back"><svg><use href="#back"/></svg></button>
            <button type="button" class="corner info"><svg><use href="#info"/></svg></button>
        </div>
    </div>

    <div class="volume hide-search hide-closed">
        <button type="button"><svg><use href="#minus"/></svg></button>
        <button type="button" class="mute"><svg><use href="#mute"/></svg><i data-t="vol"></i></button>
        <button type="button"><svg><use href="#plus"/></svg></button>
    </div>
    <div class="seekrow hide-search hide-closed">
        <button type="button"><svg><use href="#rew"/></svg><span data-t="rewind"></span></button>
        <button type="button"><span data-t="forward"></span><svg><use href="#ffw"/></svg></button>
    </div>

    <div class="jumps hide-search hide-closed">
        <button type="button" class="jump" id="j-search"><i><svg><use href="#search"/></svg></i><span data-t="search">Search</span></button>
        <button type="button" class="jump" id="j-home"><i><svg><use href="#home"/></svg></i><span data-t="home">Home</span></button>
        <button type="button" class="jump" id="j-live"><i><svg><use href="#live"/></svg></i><span data-t="live">Live TV</span></button>
        <button type="button" class="jump" id="j-guide"><i><svg><use href="#guide"/></svg></i><span data-t="guide">Guide</span></button>
        <button type="button" class="jump"><i><svg><use href="#film"/></svg></i><span data-t="movies">Movies</span></button>
        <button type="button" class="jump"><i><svg><use href="#series"/></svg></i><span data-t="series">Series</span></button>
        <button type="button" class="jump"><i><svg><use href="#heart"/></svg></i><span data-t="favs">Favourites</span></button>
        <button type="button" class="jump" id="j-more"><i><svg><use href="#more"/></svg></i><span data-t="more">More</span></button>
    </div></main>

<div class="scrim"></div>
<div class="sheet">
    <div class="grab"></div>
    <div class="tiles">
        <button type="button" class="tile"><svg><use href="#resume"/></svg><span data-t="continue">Continue watching</span></button>
        <button type="button" class="tile"><svg><use href="#live"/></svg><span data-t="lastch">Last channel</span></button>
    </div>
    <h3 data-t="numbers">Numbers</h3>
    <div class="nums">
        <button type="button" class="num">1</button><button type="button" class="num">2</button><button type="button" class="num">3</button>
        <button type="button" class="num">4</button><button type="button" class="num">5</button><button type="button" class="num">6</button>
        <button type="button" class="num">7</button><button type="button" class="num">8</button><button type="button" class="num">9</button>
        <button type="button" class="num small" data-t="prevch">PRE-CH</button><button type="button" class="num">0</button><button type="button" class="num small" data-t="go">GO</button>
    </div>
    <h3 data-t="colours">Colour keys</h3>
    <div class="colors">
        <button type="button" class="color" style="background:#e5484d"></button><button type="button" class="color" style="background:#30a46c"></button>
        <button type="button" class="color" style="background:#f5d90a"></button><button type="button" class="color" style="background:#3e63dd"></button>
    </div>
</div>
